<link rel="preconnect" href="https://mbhouzjmiglhnukpuyco.supabase.co" crossorigin><link rel="preload" href="vendor/supabase-2.119.0.js" as="script"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: menu lateral retrátil + barra superior + telas em grade. Estética HUD (anéis, cantos, linhas finas) sobre a paleta da marca ALVO. */
:root{
  --font-display:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --font-ui:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --ease:cubic-bezier(.22,.61,.36,1);
  /* modo Comando (padrão) */
  --bg:#06261F; --bg2:#082E27; --panel:rgba(15,74,60,.30); --panel-solid:#0A3A31; --field:rgba(6,38,31,.65);
  --line:rgba(226,190,132,.16); --line2:rgba(226,190,132,.34);
  --ink:#F3EEE4; --ink2:#C7C2B6; --ink3:#8FB0A4;
  --gold:#C48A2C; --accent:#E2BE84; --green:#2A7560; --green2:#3F8F77; --green3:#9CC5B5;
  --ok:#5FBF8C; --warn:#E0A94A; --bad:#E27B6B; --info:#78B0D0;
  --glow:0 0 22px rgba(196,138,44,.20); --shadow:0 12px 40px rgba(0,0,0,.35);
  color-scheme:dark;
}
body[data-mode="claro"]{
  --bg:#F7F4EE; --bg2:#F3EEE4; --panel:#FFFFFF; --panel-solid:#FFFFFF; --field:#FBF9F5;
  --line:#ECE6DB; --line2:#D8D1C5;
  --ink:#16201C; --ink2:#4D4840; --ink3:#6B6458;
  --gold:#B27C26; --accent:#9E6D20; --green:#0F4A3C; --green2:#1A5E4C; --green3:#3F8F77;
  --ok:#2F7D57; --warn:#A8721C; --bad:#B23A2B; --info:#2F5F7D;
  --glow:none; --shadow:0 12px 32px rgba(9,53,46,.14); color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body,#app{height:100%}
body{height:100dvh}
body{font:14px/1.5 var(--font-ui);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(900px 480px at 85% -8%,rgba(196,138,44,.10),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 56px;opacity:.55}
body[data-mode="claro"]::before{opacity:.25}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;font-weight:400;line-height:1}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--ink3)} .mut2{color:var(--ink2)} .sm{font-size:12px} .xs{font-size:11px}
.row{display:flex;align-items:center;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
.wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .sp{justify-content:space-between} .end{margin-left:auto}
.ic{width:18px;height:18px;flex:none;stroke-width:1.75}
.hide{display:none!important}

/* shell */
.app{position:relative;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);height:100%;--sbw:252px;transition:grid-template-columns .22s var(--ease)}
.app.rail{--sbw:76px}
.sb{--si:#F3EEE4;--si2:#9CC5B5;display:flex;flex-direction:column;gap:4px;padding:14px 12px;min-height:0;overflow:hidden;
  background:linear-gradient(180deg,#08302A,#06261F);border-right:1px solid rgba(226,190,132,.18);color:var(--si);z-index:30}
.sb-top{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px;margin-bottom:6px}
.sb-top img{height:26px;width:auto;display:block}
.sb-top .ptag{font-size:9.5px;letter-spacing:.2em;color:#E2BE84;text-transform:uppercase;border-left:1px solid rgba(226,190,132,.4);padding-left:8px;line-height:1.2}
.app.rail .sb-top{justify-content:center}.app.rail .sb-top img,.app.rail .ptag{display:none}
.sb-top .mono{display:none;font-family:var(--font-display);font-size:30px;color:#E2BE84}
.app.rail .sb-top .mono{display:block}
.orgbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;border:1px solid rgba(226,190,132,.22);background:rgba(243,238,228,.05);text-align:left}
.orgbtn:hover{background:rgba(243,238,228,.09)}
.org-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-display);font-size:18px;background:linear-gradient(135deg,#C48A2C,#9E6D20);color:#06261F;flex:none}
.orgbtn .t{font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orgbtn .s{font-size:11px;color:var(--si2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0;margin-top:8px;scrollbar-width:thin}
.grp-t{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(156,197,181,.7);padding:14px 12px 6px;white-space:nowrap}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--si2);white-space:nowrap;transition:background .15s,color .15s}
.nav a:hover{background:rgba(243,238,228,.07);color:var(--si)}
.nav a.on{background:rgba(196,138,44,.15);color:var(--si)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#C48A2C;box-shadow:0 0 12px #C48A2C}
.nav a.lock{opacity:.5}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;background:#C48A2C;color:#06261F;border-radius:99px;padding:0 7px;min-width:20px;text-align:center;line-height:18px}
.app.rail .nav .lbl,.app.rail .grp-t,.app.rail .nav .cnt,.app.rail .orgbtn .meta,.app.rail .lvl-card .txt{display:none}
.app.rail .nav a{justify-content:center;padding:0}
.app.rail .orgbtn{justify-content:center;padding:8px 0}
.nav i.ic:empty::before{content:attr(data-fb);font-style:normal;font-weight:700;font-size:13px}
.lvl-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid rgba(226,190,132,.22);background:rgba(243,238,228,.05);width:100%;text-align:left}
.lvl-card:hover{background:rgba(243,238,228,.09)}
.lvl-card .txt{min-width:0}.lvl-card .t{font-size:12.5px;font-weight:600;white-space:nowrap}.lvl-card .s{font-size:11px;color:var(--si2)}
.sb-foot{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.collapse{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:10px;color:var(--si2);font-size:12.5px;white-space:nowrap}
.collapse:hover{background:rgba(243,238,228,.07);color:var(--si)}
.app.rail .collapse{justify-content:center;padding:0}.app.rail .collapse .lbl{display:none}
.app.rail .collapse .ic{transform:rotate(180deg)}
/* Menu recolhido: ao passar o cursor, abre por cima do conteúdo; ao sair, recolhe */
.app.rail .sb{position:relative;z-index:50;width:76px;justify-self:start;transition:width .18s var(--ease),box-shadow .18s}
.app.rail .sb:hover,.app.rail .sb:focus-within{width:252px;box-shadow:12px 0 40px rgba(0,0,0,.45)}
.app.rail .sb:hover .nav .lbl,.app.rail .sb:hover .grp-t,.app.rail .sb:hover .nav .cnt,.app.rail .sb:hover .orgbtn .meta,.app.rail .sb:hover .lvl-card .txt,.app.rail .sb:hover .collapse .lbl,
.app.rail .sb:focus-within .nav .lbl,.app.rail .sb:focus-within .grp-t,.app.rail .sb:focus-within .nav .cnt,.app.rail .sb:focus-within .orgbtn .meta,.app.rail .sb:focus-within .lvl-card .txt,.app.rail .sb:focus-within .collapse .lbl{display:revert}
.app.rail .sb:hover .nav a,.app.rail .sb:focus-within .nav a{justify-content:flex-start;padding:0 12px}
.app.rail .sb:hover .orgbtn,.app.rail .sb:focus-within .orgbtn{justify-content:flex-start;padding:8px}
.app.rail .sb:hover .collapse,.app.rail .sb:focus-within .collapse{justify-content:flex-start;padding:0 12px}
.app.rail .sb:hover .sb-top,.app.rail .sb:focus-within .sb-top{justify-content:flex-start}
.app.rail .sb:hover .sb-top img,.app.rail .sb:hover .ptag,.app.rail .sb:focus-within .sb-top img,.app.rail .sb:focus-within .ptag{display:block}
.app.rail .sb:hover .sb-top .mono,.app.rail .sb:focus-within .sb-top .mono{display:none}
@media (max-width:900px){.app.rail .sb{width:272px;position:fixed}.app.rail .sb:hover{box-shadow:none}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:12px;height:64px;flex:none;padding:0 24px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);position:relative;z-index:20}
.top h1{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.top .crumb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.burger{display:none}
.search{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;min-width:260px;border-radius:10px;border:1px solid var(--line2);background:var(--field);color:var(--ink3);font-size:13px}
.search:hover{border-color:var(--gold)}
.kbd{font-size:10.5px;border:1px solid var(--line2);border-radius:5px;padding:0 5px;color:var(--ink3);margin-left:auto}
.ibtn{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);color:var(--ink2)}
.ibtn:hover{border-color:var(--line2);color:var(--ink)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.pop{position:absolute;top:56px;right:24px;width:340px;max-height:70vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);z-index:60;padding:8px}
.pop.left{left:12px;right:auto;top:calc(100% + 6px);width:280px}
.pop h4{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);padding:8px 10px}
.pi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border-radius:10px}
.pi:hover{background:var(--panel)} .pi.on{background:rgba(196,138,44,.12)}
.view{flex:1;min-height:0;overflow:auto;padding:24px 28px 48px;position:relative}
.view.flush{padding:0;overflow:hidden}
.pg{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pg-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pg-h h2{font-family:var(--font-display);font-weight:400;font-size:34px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.demo{font-size:11px;color:var(--ink3);text-align:center;padding:18px 0 0}

/* primitives */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(6px)}
.card.hud::before,.card.hud::after{content:"";position:absolute;width:16px;height:16px;border:1.5px solid var(--gold);opacity:.75;pointer-events:none}
.card.hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
.card.hud::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:14px;font-weight:600}
.card-h .eyebrow{display:block;margin-bottom:2px}
.g{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:13px;white-space:nowrap;transition:transform .1s,background .15s,border-color .15s}
.btn:hover{border-color:var(--gold)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--gold);color:#06261F;border-color:var(--gold)} .btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px} .btn.ghost{border-color:transparent} .btn.ghost:hover{background:var(--panel)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bd{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.bd.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.bd.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.bd.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.bd.info{color:var(--info);background:color-mix(in srgb,var(--info) 14%,transparent)}
.bd.gold{color:var(--accent);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.bd.mute{color:var(--ink2);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip:hover{border-color:var(--gold)} .chip.on{background:color-mix(in srgb,var(--gold) 18%,transparent);border-color:var(--gold);color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:40px;padding:0 14px;font-weight:600;font-size:13px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)} .tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink3)}
.seg button.on{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.in{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--field);width:100%;font-weight:400;font-size:13px}
textarea.in{height:auto;padding:10px 12px;resize:vertical;min-height:72px}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 28%,transparent)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select.in option{background:var(--panel-solid);color:var(--ink)}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line2);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .15s var(--ease)}
.sw.on{background:var(--gold)} .sw.on::after{transform:translateX(16px);background:#06261F}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;color:#06261F;flex:none;font-size:12px}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green2),var(--gold))}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)} .li:last-child{border-bottom:0}
.li.click:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);cursor:pointer}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl th{position:sticky;top:0;text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:12px 14px;background:var(--panel-solid);border-bottom:1px solid var(--line2);font-weight:600;white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click:hover td{background:color-mix(in srgb,var(--ink) 4%,transparent);cursor:pointer}
.tbl tr.sel td{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.chk{width:16px;height:16px;accent-color:var(--gold)}
.empty{padding:36px 16px;text-align:center;color:var(--ink3)}
.kpi{display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:38px;line-height:1;letter-spacing:.02em}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--ok)} .dn{color:var(--bad)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{display:block}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.spin{transform-origin:50% 50%;animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
@media (prefers-reduced-motion:reduce){.spin,.live{animation:none}*{transition:none!important}}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(3,20,16,.58);backdrop-filter:blur(3px);z-index:70;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel-solid);border-left:1px solid var(--line2);box-shadow:var(--shadow);z-index:80;display:flex;flex-direction:column;transform:translateX(104%);transition:transform .28s var(--ease)}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dr-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:flex-end}
.dr-f .btn{flex:1 1 auto;justify-content:center;min-width:0;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.modal.open{display:flex}
.dlg{width:min(560px,100%);max-height:84vh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px}
.dlg.wide{width:min(720px,100%)}
.cmd{padding:0;gap:0;overflow:hidden}
.cmd input{height:54px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;font-size:15px;width:100%}
.cmd input:focus{outline:none}
.cmd .res{max-height:50vh;overflow:auto;padding:8px}
.toasts{position:fixed;left:276px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:120;align-items:flex-start;pointer-events:none}
.toast{pointer-events:auto}
body[data-rail="1"] .toasts{left:100px}
.toast{display:flex;align-items:center;gap:12px;max-width:380px;background:var(--panel-solid);border:1px solid var(--line2);border-left:3px solid var(--gold);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);font-size:13px;animation:tin .25s var(--ease)}
.toast.xp{border-left-color:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* funis */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(264px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.kcol{display:flex;flex-direction:column;gap:10px;min-width:0;padding:10px;border-radius:var(--r);border:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 60%,transparent);scroll-snap-align:start}
.kcol.over{border-color:var(--gold);box-shadow:var(--glow)}
.kcol-h{display:flex;align-items:center;gap:8px;padding:2px 4px}
.kcol-h b{font-size:13px}
.kcard{display:flex;flex-direction:column;gap:9px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-solid);cursor:grab;transition:border-color .15s,transform .15s}

/* ----- métricas derivadas (tudo vem do estado, nada é digitado à mão) ----- */
function metrics(){
  const o=O(), cm=o.deals.filter(d=>d.pipe==='comercial');
  const won=cm.filter(d=>d.stage==='ganho'&&d.wonAt&&d.wonAt>=CYCLE.start);
  const active=cm.filter(d=>!['ganho','perdido'].includes(d.stage));
  const stale=active.filter(d=>d.entered>7);
  const credit=sum(won.map(d=>d.value));
  const wpct=credit/o.goal, elapsed=CYCLE.bdDone/CYCLE.bdTotal;
  const open=o.convs.filter(c=>c.status==='aberta');
  const risk=open.filter(slaRisk);
  const mine=won.filter(d=>d.owner===ME);
  const myTarget=o.goal/Math.max(1,o.users.filter(u=>u.sell&&['Vendedor','Administrador','Coordenador'].includes(u.role)).length);
  return{o,won,wonN:won.length,credit,goal:o.goal,wpct,elapsed,rhythm:elapsed?wpct/elapsed:0,left:Math.max(0,o.goal-credit),perDay:Math.max(0,o.goal-credit)/Math.max(1,CYCLE.bdTotal-CYCLE.bdDone),
    active,activeValue:sum(active.map(d=>d.value)),weighted:sum(active.map(d=>d.value*stageOf('comercial',d.stage).p)),stale,
    conv:cm.length?won.length/cm.length:0,open,risk,myCredit:sum(mine.map(d=>d.value)),myTarget,commission:sum(mine.map(d=>d.value))*0.015,
    newToday:o.convs.filter(c=>c.msgs[0].t>=new Date(NOW0.getFullYear(),NOW0.getMonth(),NOW0.getDate())).length};
}
function slaRisk(c){
  if(c.status!=='aberta')return false;const last=c.msgs[c.msgs.length-1];if(!last||last.dir!=='in')return false;
  const lim=(c.assignee?60:10); return (now()-last.t)/MIN>lim;
}
const windowOpen=c=>{const i=inst(c.instanceId);if(!i||i.kind!=='oficial')return true;return c.lastInAt&&(now()-c.lastInAt)<24*H};

/* ----- gamificação ----- */
function lvl(xp){let i=0;while(i<LEVELS.length-1&&xp>=LEVELS[i+1])i++;const nx=LEVELS[i+1]==null?null:LEVELS[i+1];return{n:i+1,title:TITLES[i],floor:LEVELS[i],next:nx,pct:nx==null?1:(xp-LEVELS[i])/(nx-LEVELS[i])}}
function achVal(a,g){const c=g.counters;switch(a.key){case'won':return c.won;case'fast':return c.fast;case'streak':return g.streak;case'docsClean':return c.docsClean;case'teamCh':return c.teamCh;case'tidyDays':return c.tidyDays;
  case'doubleWeek':return g.ach.includes('dupla')?1:0;case'cleanWallet':return g.ach.includes('carteira')?1:0;case'conv20':return metrics().conv>=.2?1:0;case'goalHit':return(metrics().myCredit/metrics().myTarget)>=1?1:0}return 0}
function checkAch(){const g=O().g[ME];ACH.forEach(a=>{if(g.ach.includes(a.id))return;if(achVal(a,g)>=a.target){g.ach.push(a.id);toast(`Conquista desbloqueada: <b>${esc(a.name)}</b>`,{xp:1,icon:a.icon,ms:6000})}})}
function award(key,o={}){
  const g=O().g[ME], rule=XP_RULES[key]; let xp=rule.xp;
  if(key==='venda')xp+=Math.min(250,Math.round((o.credit||0)/1000));
  const ck=now().toDateString()+key; g.caps[ck]=g.caps[ck]||0;
  if(rule.cap&&g.caps[ck]+xp>rule.cap){toast('Limite diário de XP desta ação atingido. O XP prioriza qualidade, não volume.',{icon:'gauge'});return 0}
  g.caps[ck]+=xp;const before=lvl(g.xp).n;g.xp+=xp;g.cycleXp+=xp;g.log.unshift({t:now(),label:rule.label,xp});
  toast(`<b>+${xp} XP</b> · ${esc(rule.label)}`,{xp:1,icon:'zap'});
  const a=lvl(g.xp);if(a.n>before)toast(`Nível ${a.n} · <b>${esc(a.title)}</b>`,{xp:1,icon:'award',ms:6000});
  checkAch();return xp;
}
function ranking(){const o=O();return o.users.filter(u=>o.g[u.id]&&u.sell).map(u=>({u,xp:o.g[u.id].cycleXp,credit:sum(o.deals.filter(d=>d.owner===u.id&&d.pipe==='comercial'&&d.stage==='ganho'&&d.wonAt>=CYCLE.start).map(d=>d.value)),lv:lvl(o.g[u.id].xp)})).sort((a,b)=>b.xp-a.xp)}

/* ----- ações de negócio ----- */
const stIdx=(pipe,id)=>PIPES[pipe].stages.findIndex(s=>s.id===id);
function moveDeal(id,stage){
  const d=deal(id);if(!d||d.stage===stage)return;
  const st=stageOf(d.pipe,stage);
  if(st.lost){return loseDialog(id)}
  const fwd=stIdx(d.pipe,stage)>stIdx(d.pipe,d.stage);
  if(st.won&&d.pipe==='comercial')return winDeal(id);
  d.stage=stage;d.entered=0;d.lost=false;
  toast(`Negócio movido para <b>${esc(st.label)}</b>`,{icon:'arrow-right'});
  if(fwd)award('avanco');
  refresh();
}
function winDeal(id){
  const d=deal(id),c=contact(d.contactId),g=O().g[ME];
  d.stage='ganho';d.wonAt=now();d.entered=0;d.lost=false;if(d.owner===ME)g.counters.won++;
  O().deals.push({id:'d'+(O().deals.length+1),contactId:c.id,pipe:'posvenda',stage:'doc',value:d.value,product:d.product,admin:d.admin,temp:'Morno',owner:d.owner,entered:0,lost:false,reason:'',wonAt:null,createdAt:now()});
  O().tasks.push({id:'t'+(O().tasks.length+1),title:`Coletar documentos · ${fname(c.name)}`,type:'documentos',due:new Date(now().getTime()+6*H),done:false,owner:d.owner,contactId:c.id,dealId:d.id,xp:5});
  toast(`Venda efetivada · <b>${brlK(d.value)}</b> com ${esc(fname(c.name))}. Caso criado no pós-venda.`,{icon:'badge-check',ms:5200,act:'go',id:'funis',actLabel:'Ver'});
  if(d.owner===ME)award('venda',{credit:d.value});
  refresh();
}
function loseDialog(id){
  const d=deal(id);
  dialog({title:'Marcar como perdido',sub:contact(d.contactId).name,submit:'Confirmar perda',
    body:`<label class="fld">Motivo<select class="in" name="reason"><option>Sem retorno do cliente</option><option>Optou por outra administradora</option><option>Sem renda comprovada</option><option>Preço acima do esperado</option><option>Desistiu do consórcio</option></select></label>
    <p class="sm muted">O negócio fica no funil, na coluna Perdido, e pode ser reaberto arrastando para outra etapa.</p>`,
    onSubmit:f=>{d.stage='perdido';d.lost=true;d.reason=f.reason;toast('Negócio marcado como perdido',{icon:'x'});refresh();redrawDrawer()}});
}

/* ----- overlays ----- */
function toast(msg,o={}){
  const el=document.createElement('div');el.className='toast'+(o.xp?' xp':'');el.setAttribute('role','status');
  el.innerHTML=`${ic(o.icon||'check')}<span class="grow">${msg}</span>${o.act?`<button class="btn sm" data-act="${o.act}" data-id="${o.id||''}">${o.actLabel}</button>`:''}`;
  const box=$('#toasts');while(box.children.length>=3)box.firstChild.remove();box.appendChild(el);icons();setTimeout(()=>el.remove(),o.ms||4200);
}
function redrawDrawer(){const d=$('#drawer');if(S.ui.drawer){d.innerHTML=S.ui.drawer();d.classList.add('open')}else d.classList.remove('open');$('#scrim').classList.toggle('open',!!(S.ui.drawer||S.ui.modal));icons()}

function closeAll(){S.ui.drawer=null;S.ui.modal=null;S.ui.pop=null;const m=$('#modal');m.classList.remove('open');m.innerHTML='';$('#drawer').classList.remove('open');$('#scrim').classList.remove('open');renderTop()}

/* ----- gráficos ----- */
function ring(p,size=168){
  const c=size/2,r1=c-5,r2=c-17,r3=c-29,circ=2*Math.PI*r2,q=Math.max(0,Math.min(1,p));
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2BE84"/><stop offset="1" stop-color="#C48A2C"/></linearGradient></defs>
  <circle class="spin" cx="${c}" cy="${c}" r="${r1}" fill="none" stroke="var(--gold)" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="1 6.1"/>
  <circle cx="${c}" cy="${c}" r="${r3}" fill="none" stroke="var(--line2)" stroke-width="1"/>
  <circle cx="${c}" cy="${c}" r="${r2}" fill="none" stroke="var(--line)" stroke-width="9"/>
  <circle cx="${c}" cy="${c}" r="${r2}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(circ*q).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/></svg>`;
}
function bars(data,w=640,h=250){
  if(!data||!data.length)return'<div class="empty">O histórico aparece depois do primeiro ciclo fechado.</div>';
  const pl=52,pr=10,pt=22,pb=30,iw=w-pl-pr,ih=h-pt-pb,top=Math.max(...data.map(d=>Math.max(d.value,d.goal)))*1.08,step=iw/data.length,bw=step*.48,y=v=>pt+ih-(v/top)*ih;
  let g='';[0,.5,1].forEach(f=>{const v=top*f;g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--ink3)">${v?brlK(v).replace('R$ ',''):'0'}</text>`});
  data.forEach((d,i)=>{const x=pl+i*step+(step-bw)/2,yy=y(d.value);
    g+=`<rect x="${x}" y="${yy}" width="${bw}" height="${pt+ih-yy}" rx="4" fill="${d.cur?'var(--gold)':'var(--green2)'}" opacity="${d.cur?1:.85}"/>
    <line x1="${x-6}" x2="${x+bw+6}" y1="${y(d.goal)}" y2="${y(d.goal)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="${x+bw/2}" y="${yy-6}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">${brlK(d.value).replace('R$ ','')}</text>
    <text x="${x+bw/2}" y="${h-10}" text-anchor="middle" font-size="11" fill="var(--ink3)">${esc(d.label)}</text>`});
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Crédito vendido por ciclo comparado à meta">${g}</svg>`;
}
function donut(parts,size=140){
  const c=size/2,r=c-14,circ=2*Math.PI*r,tot=sum(parts.map(p=>p.v))||1;let acc=0,out='';
  parts.forEach(p=>{const len=p.v/tot*circ;out+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${Math.max(0,len-2).toFixed(1)} ${(circ-len+2).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;acc+=len});
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${out}</svg>`;
}
function spark(v,w=120,h=34){
  const mx=Math.max(...v),mn=Math.min(...v),x=i=>2+i/(v.length-1)*(w-4),y=n=>h-4-((n-mn)/(mx-mn||1))*(h-8),pts=v.map((n,i)=>`${x(i).toFixed(1)},${y(n).toFixed(1)}`).join(' ');
  return`<svg viewBox="0 0 ${w} ${h}" style="height:${h}px;width:100%;max-width:${w}px;display:block" aria-hidden="true"><polygon points="2,${h} ${pts} ${w-2},${h}" fill="var(--gold)" opacity=".13"/><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="1.6"/><circle cx="${x(v.length-1)}" cy="${y(v[v.length-1])}" r="2.6" fill="var(--accent)"/></svg>`;
}
const bar=(p,c='')=>`<div class="bar" role="progressbar" aria-valuenow="${Math.round(p*100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(2,Math.min(100,p*100))}%;${c}"></i></div>`;

function qrSvg(seed){const r=rngf(seed),n=25,s=6;let out='';const fin=(x,y)=>`<rect x="${x*s}" y="${y*s}" width="${7*s}" height="${7*s}" fill="#06261F"/><rect x="${(x+1)*s}" y="${(y+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(x+2)*s}" y="${(y+2)*s}" width="${3*s}" height="${3*s}" fill="#06261F"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&r()>.52)out+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#06261F"/>`}
  return`<svg class="qr" viewBox="0 0 ${n*s} ${n*s}" role="img" aria-label="QR Code de demonstração"><rect width="100%" height="100%" fill="#fff"/>${out}${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}</svg>`}

const sellersAll=()=>{const o=O();return o.users.filter(u=>o.g[u.id]&&u.sell)};

const metricSum=k=>{const o=O();return sum(sellersAll().map(u=>{const c=o.g[u.id].counters;return k==='calls'?c.callsDone:k==='fast'?c.fastWeek:c.won}))};

function challenges(){
  const o=O(),g=o.g[ME],sl=sellersAll();g.claimed=g.claimed||[];
  const base=[
    {id:'c1',scope:'indiv',title:'Resposta relâmpago',desc:'Responda 30 conversas em menos de 5 minutos nesta semana.',cur:g.counters.fastWeek,target:30,unit:'respostas',xp:60,ends:'Termina na sexta-feira'},
    {id:'c2',scope:'indiv',title:'Documentação limpa',desc:'Formalize 5 vendas sem nenhuma correção de cadastro.',cur:g.counters.docsClean,target:5,unit:'formalizações',xp:90,ends:'Termina no fim do ciclo'},
    {id:'c3',scope:'indiv',title:'Semana sem atrasos',desc:'Conclua a agenda sem tarefas atrasadas por 5 dias úteis.',cur:g.counters.tidyDays,target:5,unit:'dias',xp:40,ends:'Meta atingida nesta semana'},
    {id:'t1',scope:'equipe',title:'Calls do ciclo',desc:'Cada call realizada pelo time soma para a meta coletiva.',cur:metricSum('calls'),target:Math.max(20,Math.round(sl.length*11/10)*10),unit:'calls',xp:100,ends:'Termina no fim do ciclo',by:'calls'},
    {id:'t2',scope:'equipe',title:'Fila sempre no prazo',desc:'Dias úteis fechados sem nenhuma conversa fora do SLA.',cur:CYCLE.bdDone,target:5,unit:'dias úteis',xp:80,ends:'Termina na sexta-feira'},
    ...(o.customCh||[]).map(c=>({...c,cur:Math.max(0,metricSum(c.by)-c.base)}))];
  return base.map(c=>({...c,cur:Math.min(c.cur,c.target),done:c.cur>=c.target,claimed:g.claimed.includes(c.id)}));
}

/* ---------- Perfil ---------- */
const PREFS_N=[['nConv','Nova conversa para mim'],['nSla','Conversa perto de estourar o SLA'],['nTasks','Tarefas do dia e atrasadas'],['nAch','Conquistas e desafios']];
VIEWS['perfil']=()=>{
  const o=O(),u=user(ME),g=o.g[ME],L=lvl(g.xp),P=S.prefs;
  const prow=(k,l,sub)=>`<div class="row sp"><div><b class="sm">${l}</b>${sub?`<div class="xs muted">${sub}</div>`:''}</div>${sw(P[k],'pref',k)}</div>`;
  return`<div class="pg"><div class="pg-h"><div class="grow"><div class="eyebrow">${esc(o.name)}</div><h2>Meu perfil</h2></div></div>
   <div class="g g12"><form class="card s7 col" data-form="perfil" style="gap:16px"><div class="row">${avN(u.name,56)}<div class="grow"><b style="font-size:16px">${esc(u.name)}</b><div class="sm muted">${bd(u.role,roleTone(u.role))} nível ${L.n} · ${esc(L.title)}</div></div></div>
    <div class="g" style="grid-template-columns:1fr 1fr"><label class="fld">Nome completo<input class="in" name="name" required maxlength="80" value="${esc(u.name)}"></label><label class="fld">Cargo<input class="in" name="cargo" maxlength="60" value="${esc(u.cargo)}"></label>
     <label class="fld">E-mail<input class="in" type="email" name="email" required value="${esc(u.email)}"></label><label class="fld">Telefone<input class="in" name="phone" value="${esc(u.phone||'(65) 99999-0000')}"></label></div>
    <label class="fld">Assinatura nas mensagens<input class="in" name="sig" maxlength="80" value="${esc(u.sig||u.name.split(' ')[0]+' · ALVO')}"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn pri" type="submit">${ic('check')}Salvar alterações</button></div></form>
    <section class="card s5 col" style="gap:16px"><div><span class="eyebrow">Aparência</span></div>
     <div class="row sp"><div><b class="sm">Tema</b><div class="xs muted">Comando é escuro; Claro é o padrão do sistema ALVO.</div></div><div class="seg"><button class="${S.ui.mode==='comando'?'on':''}" data-act="theme" data-id="comando">Comando</button><button class="${S.ui.mode==='claro'?'on':''}" data-act="theme" data-id="claro">Claro</button></div></div>
     ${prow('reduce','Reduzir animações','Para o anel orbital e os avisos de XP.')}${prow('rail','Menu lateral recolhido','Mostra só os ícones.')}</section></div>
   <div class="g g12"><section class="card s6 col" style="gap:14px"><div><span class="eyebrow">Notificações</span></div>${PREFS_N.map(p=>prow(p[0],p[1])).join('')}${prow('digest','Resumo diário por e-mail','Enviado às 8h30.')}</section>
    <section class="card s6 col" style="gap:14px"><div><span class="eyebrow">Gamificação e privacidade</span></div>${prow('rankVis','Aparecer no ranking dos colegas','Desligado, seu nome vira “Participante oculto” para os outros.')}${prow('pause','Modo pausa','Congela sequência e metas diárias em folgas e férias.')}
     <div><span class="eyebrow">Segurança</span></div>${prow('twofa','Verificação em duas etapas','Pedida em novos aparelhos.')}
     <div class="list"><div class="li">${ic('monitor')}<div class="grow sm"><b>Este navegador</b><div class="xs muted">Cuiabá · agora</div></div>${bd('Atual','ok')}</div><div class="li">${ic('smartphone')}<div class="grow sm"><b>iPhone</b><div class="xs muted">Cuiabá · ontem</div></div><button class="btn sm ghost" data-act="end-session">Encerrar</button></div></div></section></div></div>`;
};
FORMS.perfil=(form,d)=>{const u=user(ME);u.name=d.name.trim()||u.name;u.cargo=d.cargo.trim();u.email=d.email.trim();u.phone=d.phone;u.sig=d.sig;toast('Perfil atualizado',{icon:'check'});refresh()};
ACT['end-session']=el=>{el.closest('.li').remove();toast('Sessão encerrada',{icon:'log-out'})};
ACT.pref=el=>{
  const k=el.dataset.id;S.prefs[k]=!S.prefs[k];
  if(k==='rail'){S.ui.rail=S.prefs.rail;}
  if(k==='reduce')applyPrefs();
  if(k==='rankVis')O().g[ME].hidden=!S.prefs.rankVis;
  if(k==='pause')toast(S.prefs.pause?'Modo pausa ativado':'Modo pausa desativado',{icon:'pause'});
  savePrefs();applyPrefs();refresh();
};

/* ----- preferências (só conveniência por navegador; falha silenciosa) ----- */
function savePrefs(){try{localStorage.setItem('alvo-crm-demo-v1',JSON.stringify({p:S.prefs,mode:S.ui.mode,rail:S.ui.rail}))}catch(e){}}
function loadPrefs(){try{const r=JSON.parse(localStorage.getItem('alvo-crm-demo-v1')||'null');if(r){Object.assign(S.prefs,r.p||{});S.ui.mode=r.mode==='claro'?'claro':'comando';S.ui.rail=!!r.rail}}catch(e){}}
function applyPrefs(){document.body.dataset.mode=S.ui.mode;document.body.dataset.motion=S.prefs.reduce?'reduce':'';document.body.dataset.rail=S.ui.rail?'1':'0';S.prefs.rail=S.ui.rail;const a=$('.app');if(a){a.classList.toggle('rail',S.ui.rail);a.classList.toggle('mnav',S.ui.mnav)}}
function setTheme(m){S.ui.mode=m;savePrefs();applyPrefs();refresh()}

const NAV=[['Principal',[['visao-geral','layout-dashboard','D'],['kanban','kanban','F'],['suporte','life-buoy','S']]],['Leads',[['leads-frios','snowflake','L'],['contatos','refrigerator','C']]],['Clientes',[['clientes','users-round','C']]],['Financeiro',[['financeiro','wallet','F']]],['Suporte',[['emails','mail','E'],['app-clientes','smartphone','A']]],

  ['Desempenho',[['metas','trophy','M']]],['Gestão',[['equipe','users','E'],['planos','credit-card','P']]]];
const vlabel=v=>v==='perfil'?'Meu perfil':v==='contatos'?'Geladeira':v==='app-clientes'?'App dos clientes':v==='visao-geral'?'Dashboard':v==='funis'?'Negócios · pós-venda':v==='emails'?'E-mails e disparos':v==='kanban'?(seeAllLeads()?'Funis':'Meu funil'):v==='leads-frios'?'Leads Frios':v==='clientes'?(isOffice()?'Clientes / CRM Global':ROLE()==='Coordenador'?'Clientes da equipe':'Minha carteira'):v==='suporte'?'Suporte / Operacional':v==='financeiro'?(isOffice()?'Financeiro Comercial':ROLE()==='Coordenador'?'Meu financeiro':'Minhas comissões'):(MODS.find(m=>m[0]===v)||[0,v])[1];
const VIC=Object.fromEntries(NAV.flatMap(g=>g[1].map(i=>[i[0],i[1]])));
function miniRing(p,n){const r=16,c=2*Math.PI*r;return`<span class="mini-ring"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="${r}" fill="none" stroke="rgba(243,238,228,.18)" stroke-width="3"/><circle cx="20" cy="20" r="${r}" fill="none" stroke="#C48A2C" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 20 20)"/></svg><b>${n}</b></span>`}
function renderNav(){
  const o=O(),g=o.g[ME],L=lvl(g.xp),un=o.convs.filter(c=>c.status==='aberta'&&c.unread>0).length,late=o.tasks.filter(t=>!t.done&&t.owner===ME&&t.due<now()).length;
  const cnt={conversas:un,tarefas:late};
  $('#sb').innerHTML=`<div class="sb-top"><img src="${LOGO_IVORY}" alt="ALVO"><span class="ptag">Plataforma<br>Comercial</span><span class="mono" aria-hidden="true">A</span><button class="ibtn sb-tog" data-act="rail" aria-label="${S.ui.rail?'Expandir':'Recolher'} menu" title="${S.ui.rail?'Expandir':'Recolher'} menu">${ic(S.ui.rail?'panel-left-open':'panel-left-close')}</button></div>
   <button class="orgbtn" data-act="pop" data-id="org" aria-label="Trocar de organização" aria-haspopup="true"><span class="org-mark">${esc(o.mark)}</span><span class="meta grow" style="min-width:0"><div class="t">${esc(o.name)}</div><div class="s">${esc(o.sub)}</div></span>${ic('chevrons-up-down')}</button>
   <nav class="nav" aria-label="Seções">${NAV.map(gr=>[gr[0],gr[1].filter(([v])=>LV(v)>0||!O().screens)]).filter(gr=>gr[1].length).map(gr=>`<div class="grp-t">${gr[0]}</div>${gr[1].map(([v,icn,fb])=>{const lock=LV(v)===0,label=vlabel(v);return`<a href="#${v}" class="${S.view===v?'on':''} ${lock?'lock':''}" data-act="nav" data-id="${v}" title="${esc(label)}${lock?' (sem acesso)':''}" ${S.view===v?'aria-current="page"':''}>${ic(icn,'',fb)}<span class="lbl">${esc(label)}</span>${lock?`<span class="cnt" style="background:transparent;color:inherit;padding:0">${ic('lock')}</span>`:cnt[v]?`<span class="cnt">${cnt[v]}</span>`:''}</a>`}).join('')}`).join('')}</nav>
   <div class="sb-foot"><button class="lvl-card" data-act="go" data-id="metas" aria-label="Nível ${L.n}, ${esc(L.title)}. Abrir metas e conquistas">${miniRing(L.pct,L.n)}<span class="txt grow"><div class="t">${esc(L.title)}</div><div class="s num">${g.xp.toLocaleString('pt-BR')} XP${S.prefs.pause?' · pausa':''}</div><div class="bar" style="margin-top:6px;height:4px">${'<i style="width:'+Math.max(3,L.pct*100)+'%"></i>'}</div></span></button>
    <button class="collapse" data-act="rail" aria-label="${S.ui.rail?'Expandir':'Recolher'} menu">${ic('chevrons-left')}<span class="lbl">${S.ui.rail?'Fixar menu aberto':'Recolher menu'}</span></button></div>`;
  icons();
}

const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function cmdItems(q){
  const o=O(),n=norm(q.trim()),items=[];
  const add=(grp,label,icon,run,sub='')=>items.push({grp,label,icon,run,sub,k:norm(label+' '+sub)});
  MODS.forEach(m=>{if(LV(m[0])>0)add('Telas','Ir para '+m[1],VIC[m[0]]||'arrow-right',()=>go(m[0]))});
  add('Telas','Ir para Meu perfil','user-round',()=>go('perfil'));
  if(LV('contatos')>=2)add('Ações','Novo contato','user-plus',()=>ACT['new-contact']());
  if(LV('tarefas')>=2)add('Ações','Nova tarefa','list-checks',()=>ACT['new-task']({dataset:{}}));
  if(LV('funis')>=2)add('Ações','Novo negócio','plus',()=>ACT['new-deal']({dataset:{}}));
  if(LV('whatsapp')>=2)add('Ações','Conectar instância de WhatsApp','smartphone',()=>ACT.connect());
  if(LV('equipe')>=3)add('Ações','Convidar usuário','user-plus',()=>ACT.invite());
  add('Ações','Abrir chamado de suporte','life-buoy',()=>ACT['new-ticket']());
  add('Ações','Alternar tema (Comando e Claro)',S.ui.mode==='claro'?'moon':'sun',()=>ACT['theme-toggle']());
  add('Ações',S.ui.rail?'Expandir menu lateral':'Recolher menu lateral','chevrons-left',()=>ACT.rail());
  Object.values(S.orgs).filter(x=>x.id!==S.orgId).forEach(x=>add('Organizações','Trocar para '+x.name,'building-2',()=>ACT.org({dataset:{id:x.id}}),x.sub));
  if(LV('contatos')>0)o.contacts.forEach(c=>add('Contatos',c.name,'contact',()=>ACT['open-contact']({dataset:{id:c.id}}),c.phone+' · '+c.product));
  if(!n)return items.filter(i=>i.grp!=='Contatos').slice(0,9);
  const hit=items.filter(i=>i.k.includes(n));
  return[...hit.filter(i=>i.grp!=='Contatos'),...hit.filter(i=>i.grp==='Contatos').slice(0,6)].slice(0,12);
}
function cmdRes(){
  const c=S.ui.cmd;c.items=cmdItems(c.q);c.i=Math.min(c.i,Math.max(0,c.items.length-1));let last='',h='';

  return h||'<div class="empty">Nada encontrado.</div>';
}

/* ===== Dashboard executivo (proprietário, administrador e coordenador) =====
   Fonte: crm_dashboard (vendas registradas e efetivadas, metas individuais por ciclo, equipes e regiões; já filtrado pelo perfil no banco).
   Regras iguais às do Floot:
   * ciclo inicial: 01/10/2026 a 14/11/2026; transição: 15/11 a 30/11/2026; a partir de dezembro, mês cheio (01 ao último dia);
   * meta do período = soma das metas individuais do ciclo;
   * corrida ordenada pelo % da meta; o Escritório fica fora da competição (sempre por último). */
const DX={d:null,loading:false,orgFor:null,cyc:null,from:'',to:'',team:'all',seller:'all',region:'all',cmp:true};
const DX_INI={start:'2026-10-01',end:'2026-11-14'};
/* a partir de 01/12/2026 o ciclo comercial é o mês cheio (dia 1 ao último dia); 15/11–30/11 é o ciclo de transição */
const DX_MES='2026-12-01';
const dxExec=()=>['Proprietário','Administrador','Coordenador'].includes(ROLE());
const dxIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dxDay=s=>{const[y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
function dxCycle(date){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()),iso=dxIso(d),y=d.getFullYear(),m=d.getMonth();
  let start,end,kind='ciclo';
  if(iso>=DX_INI.start&&iso<=DX_INI.end){start=dxDay(DX_INI.start);end=dxDay(DX_INI.end);kind='inicial'}
  else if(iso<DX_INI.start||iso>=DX_MES){start=new Date(y,m,1);end=new Date(y,m+1,0);kind=iso>=DX_MES?'ciclo':'mes'}
  else if(iso>='2026-11-15'){start=dxDay('2026-11-15');end=dxDay('2026-11-30')}
  else if(d.getDate()>=15){start=new Date(y,m,15);end=new Date(y,m+1,14)}
  else{start=new Date(y,m-1,15);end=new Date(y,m,14)}
  return{key:dxIso(start),start,end,kind};
}
const dxDD=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const dxLabel=c=>c.kind==='mes'?['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][c.start.getMonth()]+'/'+c.start.getFullYear():`${dxDD(c.start)} a ${dxDD(c.end)}/${c.end.getFullYear()}`;
const dxCLabel=c=>c.kind==='inicial'?'Ciclo inicial · '+dxLabel(c):c.kind==='mes'?'Mês '+dxLabel(c):'Ciclo '+dxLabel(c);
const dxM=v=>{v=Number(v)||0;const a=Math.abs(v);return a>=1e6?'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi':a>=1e3?'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':'R$ '+v.toLocaleString('pt-BR')};
const dxBRL=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dxPct=v=>v==null?'—':(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
async function dxLoad(force){
  if(DX.loading||(DX.d&&!force&&DX.orgFor===S.orgId))return;DX.loading=true;
  try{DX.d=await rpc('crm_dashboard',{p_org:S.orgId});DX.orgFor=S.orgId}catch(e){fail(e)}finally{DX.loading=false;if(['visao-geral','metas','financeiro'].includes(S.view))refresh()}
}
function dxCycles(){const d=DX.d,now=dxCycle(new Date()),list=[now];let c=now;
  const first=d.sales.length?dxCycle(dxDay(d.sales[0].date)):now;
  for(let i=0;i<36&&c.start>first.start;i++){c=dxCycle(new Date(c.start.getFullYear(),c.start.getMonth(),c.start.getDate()-1));list.push(c)}return list}
const dxMem=id=>(DX.d.members.find(m=>m.id===id)||{});
const dxIsOffice=id=>dxMem(id).role==='PROPRIETARIO';
const dxName=id=>{const m=dxMem(id);return m.role==='PROPRIETARIO'?'Escritório':(m.name||user(id).name||'—')};
const dxShort=id=>{const n=dxName(id);if(n==='Escritório')return n;const p=n.toLowerCase().split(/\s+/).filter(Boolean);const w=p.length>1?[p[0],p[p.length-1]]:p;return w.map(x=>x[0].toUpperCase()+x.slice(1)).join(' ')};
const dxSum=a=>Math.round(a.reduce((t,s)=>t+Number(s.credit||0),0)*100)/100;
const dxUG=(id,c)=>{if(!c)return null;const g=DX.d.goals.find(x=>x.scope_type==='USER'&&x.scope_id===id&&String(x.start).slice(0,10)===c.key);return g?Number(g.target):null};
const dxInFilter=id=>{const m=dxMem(id);return(DX.seller==='all'||id===DX.seller)&&(DX.team==='all'||m.team_id===DX.team)&&(DX.region==='all'||m.region_id===DX.region)};
function dxFilterSales(range){return DX.d.sales.filter(s=>{const t=dxDay(s.date);return t>=range.start&&t<=range.end&&dxInFilter(s.seller)})}
/* quem entra na corrida: vendedores/coordenadores/escritório do filtro; inativos só se tiverem meta ou venda no período */
function dxPeople(c,sales){return DX.d.members.filter(m=>!['SUPORTE','FINANCEIRO'].includes(m.role)&&dxInFilter(m.id)&&(m.status==='ATIVO'||(dxUG(m.id,c)||0)>0||sales.some(s=>s.seller===m.id))).map(m=>m.id)
  .concat([...new Set(sales.map(s=>s.seller))].filter(id=>!DX.d.members.some(m=>m.id===id)))}
function dxGoal(c){if(!c)return null;const sales=dxFilterSales(c),ids=dxPeople(c,sales),g=ids.reduce((a,id)=>a+(dxUG(id,c)||0),0);return g>0?g:null}
/* ---------- gráficos ---------- */
function dxPace(cur,prev,range,prange,goal,isNow){
  const W=680,H=230,P={l:58,r:18,t:16,b:28},days=Math.round((range.end-range.start)/864e5)+1;
  const cum=(sales,r,n)=>{const arr=new Array(n).fill(0);sales.forEach(s=>{const i=Math.round((dxDay(s.date)-r.start)/864e5);if(i>=0&&i<n)arr[i]+=Number(s.credit||0)});for(let i=1;i<n;i++)arr[i]+=arr[i-1];return arr};
  const today=isNow?Math.min(days-1,Math.floor((new Date()-range.start)/864e5)):days-1;
  const a=cum(cur,range,days).map((v,i)=>i<=today?v:null),b=prev?cum(prev,prange,days):null;
  const max=Math.max(goal||0,...a.filter(v=>v!=null),...(b||[0]),1)*1.08,x=i=>P.l+(W-P.l-P.r)*i/Math.max(1,days-1),y=v=>H-P.b-(H-P.t-P.b)*v/max;
  const path=arr=>arr.map((v,i)=>v==null?'':(i&&arr[i-1]!=null?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');
  const last=a.reduce((p,v,i)=>v!=null?i:p,0),area=path(a)+`L${x(last).toFixed(1)} ${y(0)}L${x(0)} ${y(0)}Z`;
  const ticks=[0,.25,.5,.75,1].map(f=>max/1.08*f),dayAt=i=>{const d=new Date(range.start);d.setDate(d.getDate()+i);return d};
  const xl=[0,Math.round((days-1)/3),Math.round((days-1)*2/3),days-1];
  return`<svg viewBox="0 0 ${W} ${H}" class="dxsvg" role="img" aria-label="Crédito acumulado no período">
   <defs><linearGradient id="dzg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity=".28"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(t=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" class="dxgrid"/><text x="${P.l-8}" y="${y(t)+4}" class="dxax" text-anchor="end">${t?dxM(t).replace('R$ ',''):'0'}</text>`).join('')}
   ${goal?`<path d="M${x(0)} ${y(0)}L${x(days-1)} ${y(goal)}" class="dxgoal"/><text x="${W-P.r}" y="${y(goal)-7}" class="dxax" text-anchor="end">meta ${dxM(goal)}</text>`:''}
   ${b?`<path d="${path(b)}" class="dxl2"/>`:''}<path d="${area}" fill="url(#dzg)"/><path d="${path(a)}" class="dxl1"/>
   <circle cx="${x(last)}" cy="${y(a[last]||0)}" r="4.5" class="dxdot"/>
   ${xl.map((i,k)=>`<text x="${x(i)}" y="${H-8}" class="dxax" text-anchor="${k===0?'start':k===xl.length-1?'end':'middle'}">${dm(dayAt(i))}</text>`).join('')}
   ${a.map((v,i)=>`<rect x="${(x(i)-(W-P.l-P.r)/days/2).toFixed(1)}" y="${P.t}" width="${((W-P.l-P.r)/days).toFixed(1)}" height="${H-P.t-P.b}" fill="transparent" data-tip="${esc(dm(dayAt(i)))}|Acumulado: ${v==null?'—':esc(dxBRL(v))}${goal?'|Ritmo ideal: '+esc(dxM(goal*(i+1)/days)):''}${b?'|Período anterior: '+esc(dxM(b[i])):''}"/>`).join('')}
  </svg>`;
}
function dxBars(rows,goalOf){
  const max=Math.max(1,...rows.map(r=>Math.max(r.v,goalOf?goalOf(r)||0:0)));
  return`<div class="dzbars">${rows.map(r=>{const g=goalOf?goalOf(r):null;return`<div class="dzbar" data-tip="${esc(r.label)}|${esc(dxBRL(r.v))}${r.n!=null?' · '+r.n+' venda(s)':''}${g?'|Meta: '+esc(dxBRL(g))+' · '+dxPct(r.v/g):''}">
    <div class="row sp"><span class="sm nm">${esc(r.label)}</span><span class="sm num"><b>${esc(dxM(r.v))}</b>${g?` <span class="xs muted">/ ${esc(dxM(g))}</span>`:''}</span></div>
    <div class="trk"><i style="width:${(r.v/max*100).toFixed(1)}%"></i>${g?`<b class="gt" style="left:${Math.min(100,g/max*100).toFixed(1)}%"></b>`:''}</div></div>`}).join('')||'<div class="xs muted" style="padding:10px 0">Sem vendas no período.</div>'}</div>`;
}
/* pódio digital (usado também no ranking de Metas) */
function dxPodium(top){if(!top.length)return'';const ord=[1,0,2].filter(i=>top[i]);
  return`<div class="dzpod">${ord.map(i=>{const t=top[i];return`<div class="dzp p${i+1}">
    <div class="ring" style="--p:${Math.max(2,Math.min(100,(t.p||0)*100)).toFixed(0)}">${avN(t.name,i===0?64:54)}</div>
    <b class="sm nm">${esc(t.label)}</b>${t.sub?`<span class="xs muted nm">${esc(t.sub)}</span>`:''}
    <span class="pv num">${esc(t.big)}</span><span class="xs muted num">${t.small}</span>
    <div class="pil"><span class="rk">0${i+1}</span></div></div>`}).join('')}</div>`}
function dxGauge(p){const r=52,c=2*Math.PI*r,v=Math.max(0,Math.min(1,p));
  return`<div class="dzgauge"><svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><defs><linearGradient id="dzgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2BE84"/><stop offset="1" stop-color="#C48A2C"/></linearGradient></defs>
   <circle cx="75" cy="75" r="66" fill="none" stroke="var(--line2)" stroke-width="1" stroke-dasharray="2 5"/>
   <circle cx="75" cy="75" r="${r}" fill="none" stroke="color-mix(in srgb,var(--ink) 10%,transparent)" stroke-width="12"/>
   <circle cx="75" cy="75" r="${r}" fill="none" stroke="url(#dzgg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 75 75)"/></svg>
   <div class="gv"><b class="num">${dxPct(p)}</b><span class="xs muted">da meta</span></div></div>`}
/* ---------- tela ---------- */
function dxExecView(){
  dxLoad();const d=DX.d,o=O();
  if(!d)return`<div class="pg"><div class="pg-h"><div class="grow"><div class="eyebrow">${esc(o.name)}</div><h2>Dashboard</h2></div></div><div class="card"><div class="xs muted">Carregando dados…</div></div></div>`;
  const cycles=dxCycles();if(!DX.cyc||(DX.cyc!=='custom'&&!cycles.some(c=>c.key===DX.cyc)))DX.cyc=cycles[0].key;
  const custom=DX.cyc==='custom',cyc=custom?null:cycles.find(c=>c.key===DX.cyc),ci=cycles.indexOf(cyc);
  const range=custom?{start:DX.from?dxDay(DX.from):cycles[cycles.length-1].start,end:DX.to?dxDay(DX.to):new Date()}:cyc;
  const prevC=custom?null:(cycles[ci+1]||null);
  const sales=dxFilterSales(range),prev=prevC?dxFilterSales(prevC):null,real=dxSum(sales),goal=custom?null:dxGoal(cyc);
  const pct=goal?real/goal:null,prevReal=prev?dxSum(prev):null,delta=prevReal&&prevC&&prevC.kind!=='mes'&&cyc.kind!=='mes'?((real-prevReal)/prevReal):null;
  const isNow=!custom&&ci===0,days=Math.round((range.end-range.start)/864e5)+1,dayN=isNow?Math.min(days,Math.floor((new Date()-range.start)/864e5)+1):days;
  const daysLeft=isNow?Math.max(0,days-dayN+1):0,expected=goal&&isNow?goal*dayN/days:null,gap=goal?Math.max(0,goal-real):null;
  const teams=d.teams,regions=d.regions;
  /* corrida da meta */
  const people=dxPeople(cyc,sales);
  const race=people.map(id=>{const own=sales.filter(s=>s.seller===id),t=dxSum(own),g=custom?null:dxUG(id,cyc);return{id,label:dxShort(id),full:dxName(id),office:dxIsOffice(id),t,n:own.length,g:g||null,pct:g?t/g:null,team:(teams.find(x=>x.id===dxMem(id).team_id)||{}).name||'',inactive:dxMem(id).status==='INATIVO'}})
    .filter(r=>r.t>0||r.g||!r.inactive)
    .sort((a,b)=>a.office!==b.office?(a.office?1:-1):(a.pct==null)!==(b.pct==null)?(a.pct==null?1:-1):(b.pct||0)-(a.pct||0)||b.t-a.t||a.label.localeCompare(b.label,'pt-BR'));
  const raceMax=Math.max(1,...race.map(r=>r.pct||0));
  let pos=0;
  const rankT=teams.map(t=>{const ids=d.members.filter(m=>m.team_id===t.id).map(m=>m.id),ss=sales.filter(s=>ids.includes(s.seller));return{label:t.coordinator?dxShort(t.coordinator):t.name,v:dxSum(ss),n:ss.length,g:custom?null:(ids.reduce((a,id)=>a+(dxUG(id,cyc)||0),0)||null)}}).filter(r=>r.v||r.g).sort((a,b)=>b.v-a.v);
  const rankR=regions.map(r=>{const ids=d.members.filter(m=>m.region_id===r.id).map(m=>m.id),ss=sales.filter(s=>ids.includes(s.seller));return{label:r.name,v:dxSum(ss),n:ss.length,g:custom?null:(ids.reduce((a,id)=>a+(dxUG(id,cyc)||0),0)||null)}}).filter(r=>r.v||r.g).sort((a,b)=>b.v-a.v);
  const byAdm={};sales.forEach(s=>{const k=s.adm||'—';byAdm[k]=byAdm[k]||{v:0,n:0};byAdm[k].v+=Number(s.credit||0);byAdm[k].n++});
  const rankA=Object.entries(byAdm).map(([k,x])=>({label:k,v:Math.round(x.v*100)/100,n:x.n})).sort((a,b)=>b.v-a.v);
  const sellersSel=[...new Set(d.members.filter(m=>!['SUPORTE','FINANCEIRO'].includes(m.role)&&(DX.team==='all'||m.team_id===DX.team)&&(m.status==='ATIVO'||d.sales.some(s=>s.seller===m.id))).map(m=>m.id))].sort((a,b)=>dxName(a).localeCompare(dxName(b),'pt-BR'));
  const status=custom?'período personalizado':isNow?`dia ${dayN} de ${days} · ${daysLeft} dia(s) para fechar`:'encerrado';
  const tone=pct==null?'':pct>=1?'ok':expected&&real>=expected?'ok':isNow?'warn':'bad';
  const list=sales.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.id).localeCompare(String(a.id)));
  const LIM=DX.all?list.length:8;
  return`<div class="pg dz">
   <div class="pg-h"><div class="grow"><div class="eyebrow">${esc(o.name)} · ${d.scope==='ORGANIZACAO'?'visão executiva':'sua equipe'}</div><h2>Dashboard</h2></div>
    <button class="btn sm" data-act="dx-reload" title="Atualizar dados">${ic('refresh-cw')}Atualizar</button></div>
   <div class="dzfil">
    <select class="in" data-chg="dx-cyc" aria-label="Período">${cycles.map((c,i)=>`<option value="${c.key}" ${c.key===DX.cyc?'selected':''}>${esc(dxCLabel(c))}${i===0?' · atual':''}</option>`).join('')}<option value="custom" ${custom?'selected':''}>Período personalizado…</option></select>
    ${custom?`<input class="in" type="date" id="dxfrom" value="${esc(DX.from)}" aria-label="De"><input class="in" type="date" id="dxto" value="${esc(DX.to)}" aria-label="Até">`:''}
    ${teams.length>1?`<select class="in" data-chg="dx-team" aria-label="Coordenador"><option value="all">Todas as equipes</option>${teams.map(t=>`<option value="${t.id}" ${DX.team===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:''}
    <select class="in" data-chg="dx-seller" aria-label="Vendedor"><option value="all">Todos os vendedores</option>${sellersSel.map(id=>`<option value="${id}" ${DX.seller===id?'selected':''}>${esc(dxName(id))}</option>`).join('')}</select>
    ${regions.length>1&&d.scope==='ORGANIZACAO'?`<select class="in" data-chg="dx-region" aria-label="Região"><option value="all">Todas as regiões</option>${regions.map(r=>`<option value="${r.id}" ${DX.region===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`:''}
    ${DX.team!=='all'||DX.seller!=='all'||DX.region!=='all'?`<button class="btn sm ghost" data-act="dx-clear">${ic('x')}Limpar filtros</button>`:''}
   </div>
   <div class="dzhero">
    <div class="card dzmain">
     <div class="dzgrid-bg" aria-hidden="true"></div>
     <div class="eyebrow">${esc(custom?dxLabel({kind:'x',start:range.start,end:range.end}):dxCLabel(cyc))}</div>
     <div class="dzhero-in">
      <div class="grow" style="min-width:0">
       <div class="xs muted" style="margin-top:10px">Realizado · vendas efetivadas</div>
       <div class="dzbig num">${esc(dxBRL(real))}</div>
       <div class="row wrap" style="gap:8px;margin-top:4px"><span class="dztag">${ic('receipt')}${sales.length} venda${sales.length===1?'':'s'}</span>${sales.length?`<span class="dztag">${ic('ticket')}ticket ${esc(dxM(real/sales.length))}</span>`:''}${delta!=null?`<span class="dztag ${delta>=0?'up':'down'}">${ic(delta>=0?'trending-up':'trending-down')}${Math.abs(Math.round(delta*100))}% vs ciclo anterior</span>`:''}</div>
       ${goal?`<div class="dzprog"><div class="trk"><i class="${tone}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></i>${expected?`<b class="exp" style="left:${Math.min(100,expected/goal*100).toFixed(1)}%" title="Onde deveria estar hoje"></b>`:''}</div>
        <div class="row sp xs muted"><span>0</span>${expected?`<span>▲ ritmo ideal hoje ${esc(dxM(expected))}</span>`:''}<span>${esc(dxM(goal))}</span></div></div>`:`<div class="xs muted" style="margin-top:14px">${custom?'Metas valem por ciclo completo; escolha um ciclo para ver o atingimento.':'Nenhuma meta individual cadastrada para este ciclo/filtro.'}</div>`}
      </div>
      ${goal?dxGauge(pct):''}
     </div>
    </div>
    <div class="dzside">
     <div class="card dztile"><span class="ti">${ic('target')}</span><div><span class="xs muted">Meta do período</span><b class="num">${goal?esc(dxBRL(goal)):'Não definida'}</b><span class="xs muted">${goal?'soma das metas individuais':'cadastre em Metas e conquistas'}</span></div></div>
     <div class="card dztile ${gap===0?'ok':''}"><span class="ti">${ic(gap===0?'trophy':'flag')}</span><div><span class="xs muted">Falta para a meta</span><b class="num">${gap==null?'—':gap===0?'Meta batida':esc(dxBRL(gap))}</b><span class="xs muted">${isNow&&gap?'precisa de '+esc(dxM(gap/Math.max(1,daysLeft)))+' por dia até '+dxDD(range.end):goal?dxPct(pct)+' atingido':''}</span></div></div>
     <div class="card dztile"><span class="ti">${ic('history')}</span><div><span class="xs muted">${prevC?(prevC.kind==='mes'?'Mês':'Ciclo')+' anterior':'Comparação'}</span><b class="num">${prevReal!=null?esc(dxBRL(prevReal)):'—'}</b><span class="xs muted">${prevC?esc(dxLabel(prevC)):''}</span></div></div>
    </div>
   </div>
   <div class="card">
    <div class="row sp wrap"><div><b>Corrida da meta</b><div class="xs muted">Ordem pelo % da meta do ciclo · Escritório fora da competição</div></div><span class="dzchip">${race.filter(r=>!r.office).length} na disputa</span></div>
    ${dxPodium(race.filter(r=>!r.office&&(r.t>0||r.pct)).slice(0,3).map(r=>({name:r.full,label:r.label,sub:r.team,big:r.g?dxPct(r.pct):dxM(r.t),small:r.g?esc(dxM(r.t))+' de '+esc(dxM(r.g)):r.n+' venda(s)',p:r.pct||0})))}
    <div class="dzrace">${race.map(r=>{const p=r.pct||0,w=Math.min(100,p/Math.max(1,raceMax)*100);if(!r.office)pos++;
      return`<div class="dzlane ${r.office?'office':''} ${r.id===ME?'me':''}" data-tip="${esc(r.full)}|${esc(dxBRL(r.t))} · ${r.n} venda(s)${r.g?'|Meta: '+esc(dxBRL(r.g))+' · '+dxPct(r.pct):'|Sem meta no ciclo'}">
       <span class="pos">${r.office?'':pos+'º'}</span>${avN(r.full,34)}
       <div class="who"><b class="sm">${esc(r.label)}</b><span class="xs muted">${r.office?'Fora da competição':esc(r.team||'Sem equipe')}${r.inactive?' · inativo':''}</span></div>
       <div class="trk"><i style="width:${w.toFixed(1)}%"></i>${r.g?`<b class="gt" style="left:${Math.min(100,100/Math.max(1,raceMax)).toFixed(1)}%"></b>`:''}</div>
       <div class="res"><b class="sm num">${r.g?dxPct(r.pct):'sem meta'}</b><span class="xs muted num">${esc(dxM(r.t))}${r.g?' de '+esc(dxM(r.g)):''}</span></div></div>`}).join('')||'<div class="xs muted" style="padding:10px 0">Ninguém neste filtro.</div>'}</div>
   </div>

     ${dxPace(sales,DX.cmp&&!custom?prev:null,range,prevC,goal,isNow)}
     ${custom?'':`<label class="row xs muted" style="gap:6px;margin-top:6px"><input type="checkbox" data-chg="dx-cmp" ${DX.cmp?'checked':''}>comparar com o período anterior</label>`}</div>
    <div class="card"><b>${d.scope==='ORGANIZACAO'&&rankT.length>1?'Equipes (coordenadores)':'Administradoras'}</b>
     ${d.scope==='ORGANIZACAO'&&rankT.length>1?dxBars(rankT,r=>r.g)+`<div class="dzsub"><b class="sm">Administradoras</b></div>`+dxBars(rankA):dxBars(rankA)}

    <div class="tbl-wrap" style="margin-top:10px"><table class="tbl dztbl"><thead><tr><th>Cliente</th><th>Vendedor</th><th>Data</th><th>Administradora</th><th>Grupo / cota</th><th style="text-align:right">Crédito</th></tr></thead><tbody>
     ${list.slice(0,LIM).map(s=>`<tr><td><b class="sm">${esc(s.client||'—')}</b></td><td class="sm">${esc(dxShort(s.seller))}</td><td class="sm num">${esc(String(s.date).slice(0,10).split('-').reverse().join('/'))}</td><td class="sm">${esc(s.adm||'—')}${s.product?`<div class="xs muted">${esc(s.product)}</div>`:''}</td><td class="sm num">${esc((s.grp||'—')+' / '+(s.quota||'—'))}</td><td class="num" style="text-align:right">${esc(dxBRL(s.credit))}</td></tr>`).join('')||'<tr><td colspan="6" class="muted sm">Nenhuma venda efetivada no período.</td></tr>'}
    </tbody></table></div>
    ${list.length>8?`<button class="btn sm ghost" style="margin-top:8px" data-act="dx-all">${DX.all?'Mostrar menos':'Ver todas as '+list.length+' vendas'}</button>`:''}
   </div>
  </div>`;
}

/* dica ao passar o mouse nos gráficos */
(function(){let tip=null;
  document.addEventListener('mouseover',ev=>{const el=ev.target.closest&&ev.target.closest('[data-tip]');if(!el){if(tip)tip.style.display='none';return}
    if(!tip){tip=document.createElement('div');tip.className='dxtip';document.body.appendChild(tip)}
    const p=el.getAttribute('data-tip').split('|');tip.innerHTML=`<b>${esc(p[0])}</b>${p.slice(1).map(x=>`<div>${esc(x)}</div>`).join('')}`;tip.style.display='block'});
  document.addEventListener('mousemove',ev=>{if(tip&&tip.style.display==='block'){const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,ev.clientX+14)+'px';tip.style.top=(ev.clientY+14)+'px'}});
})();
